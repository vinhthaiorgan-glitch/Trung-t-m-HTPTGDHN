<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2f7b">

<title>Trung tâm Hòa Nhập – Quản lý nội bộ (bản mẫu)</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#18213d;--mut:#5a6480;--line:#d6dcee;--pri:#1b2f7b;--pri2:#e5e9f7;--warn:#b7791f;--bad:#b3392f;--ok:#1e7a4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1424;--card:#171e35;--ink:#e8ebf6;--mut:#9aa4c4;--line:#2b3556;--pri:#9db1ff;--pri2:#212b52;--warn:#e0a94a;--bad:#ef7a6f;--ok:#5fd190}}
:root[data-theme="dark"]{--bg:#0f1424;--card:#171e35;--ink:#e8ebf6;--mut:#9aa4c4;--line:#2b3556;--pri:#9db1ff;--pri2:#212b52;--warn:#e0a94a;--bad:#ef7a6f;--ok:#5fd190}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
header{padding:18px 16px 0;max-width:980px;margin:auto}
h1{font-size:20px;margin:0 0 2px}header p{margin:0;color:var(--mut);font-size:13px}
.top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
nav{display:flex;gap:4px;margin:14px 0 0;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;font-weight:500}
nav button[aria-selected=true]{color:var(--pri);border-color:var(--pri);font-weight:700}
main{max-width:980px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:15px;margin:0 0 10px}
.f{margin-bottom:10px}.row{display:flex;gap:8px}.row>*{flex:1}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:700}
:root[data-theme="dark"] .btn{color:#0b1230}
.btn.s{padding:5px 10px;font-size:13px}.btn.g{background:var(--pri2);color:var(--pri)}.btn.r{background:var(--bad);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.item{border-bottom:1px solid var(--line);padding:10px 0}.item:last-child{border:0}
.item b{display:block}.mut{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--pri2)}
.tag.w{color:var(--warn)}.tag.o{color:var(--ok)}.tag.b{color:var(--bad)}
.acts{margin-top:6px;display:flex;gap:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{border:1px solid var(--line);padding:6px;font-size:13px;text-align:left;vertical-align:top;height:46px}
th{background:var(--pri2);font-weight:700}
td .c{background:var(--pri2);border-radius:6px;padding:3px 6px}td .c.x{background:transparent;border:1px dashed var(--bad);color:var(--bad)}
.f select{margin:0}.msg{margin-top:8px;font-size:13px;min-height:18px}.msg.e{color:var(--bad)}.msg.k{color:var(--ok)}
.empty{color:var(--mut);padding:14px 0}
[hidden]{display:none!important}
</style>
</head>

const seed=()=>({leave:[{id:1,who:TEACHERS[1],type:"Nghỉ ốm",from:today,to:today,why:"Khám bệnh",st:"tp"}],
 book:[{id:1,who:TEACHERS[0],fac:FACS[1],date:today,slot:0,why:"Vận động thô nhóm 2"}],
 tt:[{id:1,who:TEACHERS[0],day:0,slot:0,grp:"Nhóm 2 – Vận động",room:FACS[1]},{id:2,who:TEACHERS[0],day:2,slot:1,grp:"Bé An – Can thiệp cá nhân",room:FACS[4]},{id:3,who:TEACHERS[1],day:0,slot:0,grp:"Nhóm 1 – Ngôn ngữ",room:FACS[3]}]});
let db;try{db=JSON.parse(localStorage.getItem("ttapp"))}catch(e){}
if(!db||!db.leave)db=seed();
const save=()=>{try{localStorage.setItem("ttapp",JSON.stringify(db))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opts=(el,arr)=>{el.innerHTML=arr.map((v,i)=>`<option value="${i}">${esc(v)}</option>`).join("")};
const optv=(el,arr)=>{el.innerHTML=arr.map(v=>`<option>${esc(v)}</option>`).join("")};
const msg=(id,t,ok)=>{const m=$(id);m.textContent=t;m.className="msg "+(ok?"k":"e")};
const fmt=d=>d.split("-").reverse().join("/");
["l-who","r-who","t-who","t-view"].forEach(i=>optv($(i),TEACHERS));
optv($("r-fac"),FACS);optv($("t-room"),FACS);opts($("r-slot"),SLOTS);opts($("t-slot"),SLOTS);opts($("t-day"),DAYS);
["l-from","l-to","r-date"].forEach(i=>$(i).value=today);
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
 ["leave","room","tt","att","ev"].forEach(s=>$(s).hidden=s!==b.dataset.t);});
function renderLeave(){
 const role=$("role").value,L=db.leave.slice().reverse();
 $("l-list").innerHTML=L.length?L.map(x=>{const s=ST[x.st];
  const can=(x.st==="tp"&&role==="tp")||(x.st==="gd"&&role==="gd");
  return `<div class="item"><b>${esc(x.who)} · ${esc(x.type)}</b><span class="mut">${fmt(x.from)} – ${fmt(x.to)} · ${esc(x.why||"Không ghi lý do")}</span><div><span class="tag ${s[1]}">${s[0]}</span></div>
  ${can?`<div class="acts"><button class="btn s" data-a="ok" data-id="${x.id}">Duyệt</button><button class="btn s r" data-a="no" data-id="${x.id}">Từ chối</button></div>`:""}</div>`}).join(""):`<div class="empty">Chưa có đơn nào. Gửi đơn ở khung bên trái.</div>`;
}
$("l-send").onclick=()=>{
 const f=$("l-from").value,t=$("l-to").value;
 if(!f||!t||t<f)return msg("l-msg","Ngày kết thúc phải sau hoặc bằng ngày bắt đầu.");
 db.leave.push({id:Date.now(),who:$("l-who").value,type:$("l-type").value,from:f,to:t,why:$("l-why").value.trim(),st:"tp"});
 save();$("l-why").value="";msg("l-msg","Đã gửi đơn, đang chờ trưởng phòng duyệt.",1);renderLeave();};
$("l-list").onclick=e=>{const b=e.target.closest("button[data-a]");if(!b)return;
 const x=db.leave.find(v=>v.id==b.dataset.id);
 x.st=b.dataset.a==="no"?"no":(x.st==="tp"?"gd":"ok");save();renderLeave();};
$("role").onchange=renderLeave;
function renderRoom(){
 const d=$("r-date").value;$("r-day").textContent=d?fmt(d):"";
 const B=db.book.filter(b=>b.date===d);
 let h="<table><tr><th>Địa điểm</th>"+SLOTS.map(s=>`<th>${s}</th>`).join("")+"</tr>";
 FACS.forEach(f=>{h+=`<tr><th>${esc(f)}</th>`+SLOTS.map((_,i)=>{const b=B.find(v=>v.fac===f&&v.slot===i);
  return `<td>${b?`<div class="c">${esc(b.who)}<br><span class="mut">${esc(b.why)}</span></div>`:""}</td>`}).join("")+"</tr>"});
 $("r-grid").innerHTML=h+"</table>";
 $("r-list").innerHTML=B.length?"":`<div class="empty">Ngày này chưa có ai đăng ký.</div>`;
}
$("r-date").onchange=renderRoom;
$("r-send").onclick=()=>{
 const d=$("r-date").value,f=$("r-fac").value,s=+$("r-slot").value;
 if(!d)return msg("r-msg","Hãy chọn ngày.");
 const c=db.book.find(b=>b.date===d&&b.fac===f&&b.slot===s);
 if(c)return msg("r-msg",`Trùng lịch: ${c.who} đã đăng ký ${f} khung ${SLOTS[s]}.`);
 db.book.push({id:Date.now(),who:$("r-who").value,fac:f,date:d,slot:s,why:$("r-why").value.trim()||"Hoạt động nhóm"});
 save();msg("r-msg","Đăng ký thành công.",1);renderRoom();};
function renderTT(){
 const w=$("t-view").value,T=db.tt.filter(x=>x.who===w);
 let h="<table><tr><th>Tiết</th>"+DAYS.map(d=>`<th>${d}</th>`).join("")+"</tr>";
 SLOTS.forEach((s,i)=>{h+=`<tr><th>${s}</th>`+DAYS.map((_,j)=>{const x=T.find(v=>v.day===j&&v.slot===i);
  return `<td>${x?`<div class="c">${esc(x.grp)}<br><span class="mut">${esc(x.room)}</span> <button class="btn s g" data-del="${x.id}" aria-label="Xóa tiết">Xóa</button></div>`:""}</td>`}).join("")+"</tr>"});
 $("t-grid").innerHTML=h+"</table>";
}
$("t-view").onchange=renderTT;
$("t-grid").onclick=e=>{const b=e.target.closest("[data-del]");if(!b)return;db.tt=db.tt.filter(x=>x.id!=b.dataset.del);save();renderTT();};
$("t-send").onclick=()=>{
 const who=$("t-who").value,day=+$("t-day").value,slot=+$("t-slot").value,room=$("t-room").value,grp=$("t-grp").value.trim();
 if(!grp)return msg("t-msg","Hãy nhập học sinh hoặc nhóm.");
 const a=db.tt.find(x=>x.who===who&&x.day===day&&x.slot===slot);
 if(a)return msg("t-msg",`Giáo viên đã có tiết "${a.grp}" vào ${DAYS[day]}, ${SLOTS[slot]}.`);
 const b=db.tt.find(x=>x.room===room&&x.day===day&&x.slot===slot);
 if(b)return msg("t-msg",`${room} đã được ${b.who} dùng vào ${DAYS[day]}, ${SLOTS[slot]}.`);
 db.tt.push({id:Date.now(),who,day,slot,grp,room});save();$("t-grp").value="";
 $("t-view").value=who;msg("t-msg","Đã thêm tiết.",1);renderTT();};
db.att=db.att||[];db.ev=db.ev||[];
const STUDENTS=["Bé An","Bé Bình","Bé Chi","Bé Dũng","Bé Hân","Bé Khang"];
const CRIT=["Mục tiêu phù hợp năng lực học sinh","Phương pháp và đồ dùng hỗ trợ","Cá nhân hóa hỗ trợ từng em","Tổ chức lớp, tương tác","Ghi nhận tiến bộ của học sinh"];
$("a-date").value=today;$("e-date").value=today;optv($("e-by"),TEACHERS);optv($("e-who"),TEACHERS);opts($("e-slot"),SLOTS);
$("e-crit").innerHTML=CRIT.map((c,i)=>`<div class="f"><label for="c${i}">${c}</label><select id="c${i}">${[5,4,3,2,1].map(n=>`<option value="${n}"${n==4?" selected":""}>${n} điểm</option>`).join("")}</select></div>`).join("");
const now=()=>new Date().toTimeString().slice(0,5);
function renderAtt(){
 const m=$("a-mode").value,d=$("a-date").value,L=m==="gv"?TEACHERS:STUDENTS;
 const rec=n=>db.att.find(a=>a.d===d&&a.m===m&&a.n===n)||{};
 let inn=0,out=0,abs=0;
 $("a-tab").innerHTML="<tr><th>Họ tên</th><th>Có mặt</th><th>Ra về</th><th>Trạng thái</th></tr>"+L.map(n=>{const r=rec(n);
  if(r.in)inn++;if(r.out)out++;if(r.abs)abs++;
  const st=r.abs?'<span class="tag b">Vắng</span>':r.out?'<span class="tag o">Đã ra về</span>':r.in?'<span class="tag w">Đang có mặt</span>':'<span class="mut">Chưa điểm danh</span>';
  return `<tr><td>${esc(n)}</td><td>${r.in?r.in:`<button class="btn s" data-a="in" data-n="${esc(n)}">Có mặt</button> <button class="btn s g" data-a="abs" data-n="${esc(n)}">Vắng</button>`}</td><td>${r.out?r.out:(r.in?`<button class="btn s" data-a="out" data-n="${esc(n)}">Ra về</button>`:"")}</td><td>${st}</td></tr>`}).join("");
 $("a-sum").textContent=`Có mặt ${inn}/${L.length} · Đã ra về ${out} · Vắng ${abs}`;
}
$("a-mode").onchange=$("a-date").onchange=renderAtt;
$("a-tab").onclick=e=>{const b=e.target.closest("button[data-a]");if(!b)return;
 const m=$("a-mode").value,d=$("a-date").value,n=b.dataset.n;
 if(d!==today)return msg("a-msg","Chỉ điểm danh được cho ngày hôm nay.");
 let r=db.att.find(a=>a.d===d&&a.m===m&&a.n===n);if(!r){r={d,m,n};db.att.push(r)}
 if(b.dataset.a==="in")r.in=now();else if(b.dataset.a==="abs")r.abs=1;else r.out=now();
 save();msg("a-msg","",1);renderAtt();};
const grade=v=>v>=4.5?"Xuất sắc":v>=3.5?"Tốt":v>=2.5?"Đạt":"Chưa đạt";
$("e-send").onclick=()=>{
 const grp=$("e-grp").value.trim(),by=$("e-by").value,who=$("e-who").value;
 if(!grp)return msg("e-msg","Hãy nhập học sinh hoặc nhóm.");
 if(by===who)return msg("e-msg","Người dự giờ và giáo viên được dự phải khác nhau.");
 const sc=CRIT.map((_,i)=>+$("c"+i).value),avg=sc.reduce((a,b)=>a+b,0)/sc.length;
 db.ev.push({id:Date.now(),by,who,date:$("e-date").value,slot:+$("e-slot").value,grp,sc,avg,note:$("e-note").value.trim()});
 save();$("e-note").value="";$("e-grp").value="";msg("e-msg",`Đã lưu: ${avg.toFixed(1)}/5, loại ${grade(avg)}.`,1);renderEv();};
function renderEv(){
 const L=db.ev.slice().reverse();
 $("e-list").innerHTML=L.length?L.map(x=>`<div class="item"><b>${esc(x.who)} · ${x.avg.toFixed(1)}/5 <span class="tag ${x.avg>=3.5?"o":x.avg>=2.5?"w":"b"}">${grade(x.avg)}</span></b><span class="mut">${fmt(x.date)}, ${SLOTS[x.slot]} · ${esc(x.grp)} · người dự: ${esc(x.by)}</span><div class="mut">${x.sc.join(" / ")}${x.note?" · "+esc(x.note):""}</div><div class="acts"><button class="btn s g" data-ev="${x.id}">Xóa</button></div></div>`).join(""):`<div class="empty">Chưa có phiếu nào. Điền phiếu ở khung bên trái.</div>`;
}
$("e-list").onclick=e=>{const b=e.target.closest("[data-ev]");if(!b)return;db.ev=db.ev.filter(x=>x.id!=b.dataset.ev);save();renderEv();};
renderLeave();renderRoom();renderTT();renderAtt();renderEv();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
